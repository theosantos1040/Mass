plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.theo.patcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.theo.patcher"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.1-cleanresign"
        manifestPlaceholders = [:]
        multiDexEnabled true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }

    signingConfigs {
        theopatch {
            storeFile file('../theopatch.keystore')
            storePassword 'theopatch'
            keyAlias 'theopatch'
            keyPassword 'theopatch'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.theopatch
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.theopatch
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'commons-io:commons-io:2.11.0'

    // Google's official APK signing library (used by Android Studio / apksigner)
    implementation 'com.android.tools.build:apksig:8.2.2'

    // BouncyCastle for X.509 cert generation on Android runtime
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
}
